name: Automated Database Backup

on:
  schedule:
    # Run every Sunday at midnight UTC (05:45 AM NPT)
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allows manual backup trigger anytime from the GitHub Actions tab

permissions:
  contents: write

jobs:
  backup:
    name: Backup PostgreSQL (Permanent & Artifact)
    runs-on: ubuntu-latest

    steps:
      - name: Check Database URL Secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set in GitHub Repository Settings -> Secrets and variables -> Actions"
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 Client
        run: |
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Execute pg_dump and Compress
        id: dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -e -o pipefail
          BACKUP_DATE=$(date +'%Y-%m-%d_%H%M%S')
          mkdir -p backups_temp
          
          # Clean URL: strip quotes and replace "-pooler." with "." for direct compute connection required by pg_dump
          CLEAN_URL=$(echo "$DATABASE_URL" | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//" -e 's/-pooler\././')
          
          echo "Dumping PostgreSQL 17 database from direct endpoint..."
          pg_dump "$CLEAN_URL" --clean --if-exists --no-owner --no-privileges | gzip > "backups_temp/vyapaar-db-${BACKUP_DATE}.sql.gz"
          
          DUMP_SIZE=$(stat -c%s "backups_temp/vyapaar-db-${BACKUP_DATE}.sql.gz")
          echo "Compressed backup created: ${DUMP_SIZE} bytes"
          if [ "$DUMP_SIZE" -lt 100 ]; then
            echo "::error::Backup file is suspiciously small (${DUMP_SIZE} bytes). Dump may have failed."
            exit 1
          fi
          
          echo "backup_file=vyapaar-db-${BACKUP_DATE}.sql.gz" >> $GITHUB_OUTPUT
          echo "backup_date=${BACKUP_DATE}" >> $GITHUB_OUTPUT
          ls -lh backups_temp/

      - name: Upload to GitHub Actions Artifacts (Downloadable for 90 days)
        uses: actions/upload-artifact@v4
        with:
          name: vyapaar-backup-${{ steps.dump.outputs.backup_date }}
          path: backups_temp/*.sql.gz
          retention-days: 90

      - name: Save Backup Permanently to "backups" Branch (Stored Forever)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Fetch and switch to the permanent 'backups' branch
          git fetch origin
          if git ls-remote --heads origin backups | grep -q backups; then
            git checkout backups
          else
            git checkout --orphan backups
            git rm -rf .
          fi
          
          mkdir -p database-snapshots
          cp backups_temp/*.sql.gz database-snapshots/
          
          echo "# Vyapaar Database Backups" > README.md
          echo "This branch contains automated weekly PostgreSQL backups generated by GitHub Actions." >> README.md
          echo "Snapshots are stored permanently in the database-snapshots/ folder." >> README.md

          git add database-snapshots/ README.md
          git commit -m "chore(backup): weekly snapshot ${{ steps.dump.outputs.backup_date }}" || echo "No changes to commit"
          git push origin backups
